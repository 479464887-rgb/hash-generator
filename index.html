<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hash Generator - 免费Online Tools</title>
<meta name="description" content="在线哈希Generate器 - MD5, SHA-1, SHA-256, SHA-512 一键Generate">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;flex-direction:column}
header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:700;color:#58a6ff}
.logo span{color:#f0c040}
header .badge{font-size:10px;background:#daa520;color:#fff;padding:2px 8px;border-radius:10px;margin-left:8px}
main{max-width:700px;margin:0 auto;padding:32px 24px;flex:1}
.tool-wrapper{padding:20px 0}
footer{padding:16px 24px;border-top:1px solid #21262d;text-align:center;font-size:12px;color:#484f58}
footer a{color:#58a6ff;text-decoration:none;margin:0 8px}
.btn-primary:hover{background:#2ea043!important}
.btn:hover{background:#30363d!important}
input:focus,textarea:focus,select:focus{outline:none;border-color:#58a6ff!important}
.btn{font-family:inherit}
/* 响应式设计 */
@media (max-width: 768px) {
  body { padding: 12px; }
  header { padding: 12px 16px; flex-direction: column; }
  .container { max-width: 100%; padding: 0 8px; }
  h1 { font-size: 1.5rem; }
  textarea, input, select, button { width: 100%; }
  .grid { grid-template-columns: 1fr; }
  .card { padding: 12px; }
}</style>
</head>
<body>
<header>
  <div class="logo">🛠 <span>Dev</span>Kit<span class="badge">BETA</span></div>
  <div style="font-size:11px;color:#8b949e">🔒 Processed locally · 数据不Upload</div>
</header>
<main>
  <h1 style="font-size:24px;margin-bottom:4px">Hash Generator</h1>
  <p style="color:#8b949e;font-size:14px;margin-bottom:8px">在线哈希Generate器 - MD5, SHA-1, SHA-256, SHA-512 一键Generate</p>
<div class="tool-wrapper">
  <textarea id="hash-input" placeholder="Input要计算哈希的文字..." rows="4" style="width:100%;padding:16px;font-size:14px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#c9d1d9;resize:vertical;outline:none;font-family:mono;line-height:1.6"></textarea>
  <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
    <button class="btn btn-primary" style="padding:8px 16px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600" onclick="hashAll()">🔄 全部计算</button>
    <button class="btn" style="padding:8px 16px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;cursor:pointer;font-size:12px" onclick="document.getElementById('hash-input').value='';document.getElementById('hash-result').innerHTML='<span style=color:#8b949e>Input文字查看哈希值</span>'">🗑 Clear</button>
  </div>
  <div id="hash-result" style="display:grid;gap:8px"><span style="color:#8b949e">Input文字查看哈希值</span></div>
</div>
</main>
<footer>
  <a href="https://github.com/479464887-rgb/hash-generator">GitHub</a>
  <span>·</span>
  <span>© 2026 DevKit</span>
</footer>
<script>async function hashAll(){
  const inp=document.getElementById('hash-input').value;
  if(!inp)return;
  const enc=new TextEncoder().encode(inp);
  const algos=[['MD5','MD5'],['SHA-1','SHA-1'],['SHA-256','SHA-256'],['SHA-384','SHA-384'],['SHA-512','SHA-512']];
  const container=document.getElementById('hash-result');container.innerHTML='<span style=color:#8b949e>计算中...</span>';
  let html='';
  for(const[name,algo] of algos){
    try{
      const hash=await crypto.subtle.digest(algo,enc);
      const hex=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
      html+=`<div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:#161b22;border:1px solid #30363d;border-radius:6px"><div style="font-size:12px;font-weight:600;color:#8b949e;min-width:60px">${name}</div><div style="font-family:mono;font-size:12px;color:#c9d1d9;word-break:break-all">${hex}</div><button onclick="navigator.clipboard.writeText('${hex}')" style="background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:10px;white-space:nowrap">Copy</button></div>`;
    }catch(e){html+=`<div style="color:#f85149">${name}: ${e.message}</div>`;}
  }
  container.innerHTML=html;
}
document.getElementById('hash-input').addEventListener('input',()=>{clearTimeout(window._ht);window._ht=setTimeout(hashAll,300)});
</script>
</body>
</html>
